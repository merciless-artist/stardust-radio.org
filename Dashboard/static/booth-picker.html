<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJ Booth — Select Server</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-deep: #08080f;
            --bg-panel: #0f0f1e;
            --accent: #e94560;
            --text: #d0d0d8;
            --text-dim: #606078;
            --text-muted: #3a3a50;
            --border: #1a1a35;
        }

        body {
            background: var(--bg-deep);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .picker {
            text-align: center;
            max-width: 480px;
            width: 90%;
        }

        .picker-logo {
            width: 64px;
            height: 64px;
            border-radius: 12px;
            object-fit: cover;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 4px;
            margin-bottom: 6px;
        }

        .subtitle {
            color: var(--text-dim);
            font-size: 14px;
            margin-bottom: 32px;
        }

        .server-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .server-card {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px 20px;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            text-decoration: none;
            color: var(--text);
            transition: all 0.15s;
            cursor: pointer;
            /* Anchor point for the stretched link below. */
            position: relative;
        }

        .server-card:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(233, 69, 96, 0.15);
        }

        /* Stretch the card's link over the whole card — including the padding
           and gaps — so every pixel that looks clickable actually is. */
        .server-card__hit::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
        }

        .server-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1a1a35, #2a2050);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
            overflow: hidden;
            cursor: pointer;
            /* Above the stretched card link so icon-upload clicks still land. */
            position: relative;
            z-index: 1;
        }

        .server-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .server-icon:hover::after {
            content: '✎';
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #fff;
        }

        .file-input { display: none; }

        .server-info {
            text-align: left;
            flex: 1;
            min-width: 0;
        }

        .server-name {
            font-weight: 700;
            font-size: 16px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .server-meta {
            color: var(--text-dim);
            font-size: 12px;
            margin-top: 2px;
        }

        .server-arrow {
            color: var(--text-muted);
            font-size: 18px;
            flex-shrink: 0;
        }

        .server-card:hover .server-arrow { color: var(--accent); }

        .empty {
            color: var(--text-muted);
            font-size: 15px;
            padding: 40px 0;
        }

        .loading {
            color: var(--text-dim);
            font-size: 15px;
            padding: 40px 0;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        /* ◸──────── ✧ ────────🔹-💠-🔹──────── ◇ ———————◹
              SECTION: No-Server sessions (host with no bot at all)
           ◺──────── ✧ ────────🔹-💠-🔹──────── ◇ ———————◿ */
        .solo {
            margin-top: 36px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
            text-align: left;
        }

        .solo-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 4px;
        }

        .solo-title {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .solo-sub {
            color: var(--text-dim);
            font-size: 12px;
            margin-bottom: 14px;
        }

        .solo-new {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
        }

        .solo-input {
            flex: 1;
            min-width: 0;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg-panel);
            color: var(--text);
            font: 14px 'Segoe UI', system-ui, sans-serif;
        }

        .solo-input:focus { outline: none; border-color: var(--accent); }

        .solo-btn {
            padding: 10px 18px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg-panel);
            color: var(--text);
            font: 700 13px 'Segoe UI', system-ui, sans-serif;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.15s;
        }

        .solo-btn:hover:not(:disabled) { border-color: var(--accent); color: #fff; }
        .solo-btn:disabled { opacity: .5; cursor: default; }

        .solo-card {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 13px 16px;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 8px;
            transition: all 0.15s;
            cursor: pointer;
            /* Anchor point for the stretched link below. */
            position: relative;
        }

        .solo-card:hover { border-color: var(--accent); }

        /* Stretch the link across the whole card so the padding and gaps are
           clickable too, not just the text. */
        .solo-card__link::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
        }

        .solo-card__link {
            flex: 1;
            min-width: 0;
            display: flex;
            align-items: baseline;
            gap: 10px;
            text-decoration: none;
            color: inherit;
        }

        .solo-card__name {
            font-weight: 700;
            font-size: 15px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .solo-card__meta { color: var(--text-dim); font-size: 12px; flex-shrink: 0; }

        .solo-card__del {
            background: none;
            border: 0;
            color: var(--text-muted);
            font-size: 16px;
            cursor: pointer;
            padding: 2px 6px;
            flex-shrink: 0;
            /* Above the stretched link so delete clicks don't open the booth. */
            position: relative;
            z-index: 1;
        }

        .solo-card__del:hover { color: var(--accent); }

        .solo-error { color: var(--accent); font-size: 12px; margin-bottom: 8px; }

        /* Visually hidden, still read by screen readers. */
        .sr-only {
            position: absolute;
            width: 1px; height: 1px;
            padding: 0; margin: -1px;
            overflow: hidden;
            clip: rect(0 0 0 0);
            white-space: nowrap;
            border: 0;
        }
    </style>
</head>
<body>
    <div class="picker">
        <img src="/booth/logo.png" alt="" class="picker-logo">
        <h1>DJ BOOTH</h1>
        <p class="subtitle">Select a server</p>
        <div class="server-list" id="server-list">
            <div class="loading">Loading servers...</div>
        </div>

        <!-- ⪧•──────⪧✿⪦── 🦋──⪧✿──────⪦ ◯ 🌸 ◯ ──────⪧✿───────⪦ --->
        <!--    SECTION: No-Server sessions — host with no bot at all    --->
        <!-- ⪧──•───✿⪦──────⪧•────────⪧✿⪦ ◯ 🌸 ◯ ✿⪦────⪧•───✿⪦────•⪦ --->
        <section class="solo">
            <div class="solo-head">
                <span class="solo-title">No-Server Sessions</span>
            </div>
            <p class="solo-sub">
                Run a listening party with no bot and no Discord server.
                Make a session, open it, and paste your song links straight in.
            </p>

            <div class="solo-new">
                <label class="sr-only" for="solo-name">New session name</label>
                <input id="solo-name" class="solo-input" maxlength="80"
                       placeholder="Session name (e.g. Friday LP)"
                       onkeydown="if(event.key==='Enter'){soloCreate();}">
                <button type="button" class="solo-btn" id="solo-create" onclick="soloCreate()">
                    Create
                </button>
            </div>

            <p class="solo-error" id="solo-error" hidden></p>
            <div id="solo-list"></div>
        </section>
    </div>

    <script>
    fetch('/api/guilds')
        .then(function(r) { return r.json(); })
        .then(function(guilds) {
            var list = document.getElementById('server-list');

            if (!guilds.length || guilds.error) {
                list.innerHTML = '<div class="empty">No servers found. Use !starttracking in a Discord channel first.</div>';
                return;
            }

            var html = '';
            guilds.forEach(function(g) {
                var initial = g.name.charAt(0).toUpperCase();
                var iconContent = g.icon
                    ? '<img src="' + g.icon + '">'
                    : initial;
                html +=
                    '<div class="server-card">' +
                    '<div class="server-icon" onclick="event.preventDefault();event.stopPropagation();uploadIcon(\'' + g.guild_id + '\')">' + iconContent + '</div>' +
                    '<a class="server-card__hit" href="/booth?guild=' + g.guild_id + '" style="display:flex;align-items:center;gap:16px;flex:1;text-decoration:none;color:inherit;">' +
                    '<div class="server-info">' +
                    '<div class="server-name">' + g.name + '</div>' +
                    '<div class="server-meta">' + g.song_count + ' songs</div>' +
                    '</div>' +
                    '<span class="server-arrow">&#8594;</span>' +
                    '</a>' +
                    '</div>';
            });
            list.innerHTML = html;
        })
        .catch(function() {
            document.getElementById('server-list').innerHTML =
                '<div class="empty">Could not load servers. Is the database running?</div>';
        });

    /* ╭─────────────────────────────────── ♱ · NO-SERVER SESSIONS · ♱ ─╮
     *   Create / list / delete botless sessions. No bot, no database.
     * ╰─ ♱ · 𓆩🤍𓆪 · ♱ ────────────────────────────────────────────────╯ */

    function soloError(msg) {
        var el = document.getElementById('solo-error');
        el.hidden = !msg;
        el.textContent = msg || '';
    }

    function soloEscape(text) {
        var d = document.createElement('div');
        d.textContent = text == null ? '' : String(text);
        return d.innerHTML;
    }

    function soloRender(sessions) {
        var list = document.getElementById('solo-list');
        if (!sessions.length) {
            list.innerHTML = '';
            return;
        }
        list.innerHTML = sessions.map(function(s) {
            var count = s.song_count === 1 ? '1 song' : (s.song_count || 0) + ' songs';
            return '' +
                '<div class="solo-card">' +
                  '<a class="solo-card__link" href="/booth?solo=' + encodeURIComponent(s.id) + '">' +
                    '<span class="solo-card__name">' + soloEscape(s.name) + '</span>' +
                    '<span class="solo-card__meta">' + count + '</span>' +
                  '</a>' +
                  '<button type="button" class="solo-card__del" title="Delete this session" ' +
                          'aria-label="Delete ' + soloEscape(s.name) + '" ' +
                          'onclick="soloDelete(\'' + s.id + '\')">&#10005;</button>' +
                '</div>';
        }).join('');
    }

    function soloLoad() {
        fetch('/api/solo/sessions')
            .then(function(r) { return r.json(); })
            .then(function(list) { soloRender(Array.isArray(list) ? list : []); })
            .catch(function() { /* signed out or offline — leave the list empty */ });
    }

    function soloCreate() {
        var input = document.getElementById('solo-name');
        var btn = document.getElementById('solo-create');
        var name = input.value.trim();
        if (!name) {
            soloError('Give the session a name first.');
            input.focus();
            return;
        }

        soloError('');
        btn.disabled = true;

        fetch('/api/solo/sessions', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: name })
        })
            .then(function(r) { return r.json(); })
            .then(function(session) {
                if (!session || !session.id) {
                    throw new Error((session && session.error) || 'Could not create the session.');
                }
                input.value = '';
                soloLoad();
            })
            .catch(function(err) { soloError(err.message || 'Could not create the session.'); })
            .finally(function() { btn.disabled = false; });
    }

    function soloDelete(sessionId) {
        if (!confirm('Delete this session and its queue?')) return;
        fetch('/api/solo/sessions/' + encodeURIComponent(sessionId), { method: 'DELETE' })
            .then(function() { soloLoad(); })
            .catch(function() { soloError('Could not delete that session.'); });
    }

    soloLoad();

    function uploadIcon(guildId) {
        var input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.onchange = function() {
            var file = input.files[0];
            if (!file) return;
            var form = new FormData();
            form.append('icon', file);
            fetch('/api/guilds/' + guildId + '/icon', {
                method: 'POST',
                body: form
            }).then(function(r) {
                if (r.ok) location.reload();
            });
        };
        input.click();
    }
    </script>
</body>
</html>
