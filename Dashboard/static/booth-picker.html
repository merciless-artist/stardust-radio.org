<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJ Booth — Select Server</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-deep: #08080f;
            --bg-panel: #0f0f1e;
            --accent: #e94560;
            --text: #d0d0d8;
            --text-dim: #606078;
            --text-muted: #3a3a50;
            --border: #1a1a35;
        }

        body {
            background: var(--bg-deep);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .picker {
            text-align: center;
            max-width: 480px;
            width: 90%;
        }

        .picker-logo {
            width: 64px;
            height: 64px;
            border-radius: 12px;
            object-fit: cover;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 4px;
            margin-bottom: 6px;
        }

        .subtitle {
            color: var(--text-dim);
            font-size: 14px;
            margin-bottom: 32px;
        }

        .server-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .server-card {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px 20px;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            text-decoration: none;
            color: var(--text);
            transition: all 0.15s;
            cursor: pointer;
        }

        .server-card:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(233, 69, 96, 0.15);
        }

        .server-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1a1a35, #2a2050);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
            overflow: hidden;
            position: relative;
            cursor: pointer;
        }

        .server-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .server-icon:hover::after {
            content: '✎';
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #fff;
        }

        .file-input { display: none; }

        .server-info {
            text-align: left;
            flex: 1;
            min-width: 0;
        }

        .server-name {
            font-weight: 700;
            font-size: 16px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .server-meta {
            color: var(--text-dim);
            font-size: 12px;
            margin-top: 2px;
        }

        .server-arrow {
            color: var(--text-muted);
            font-size: 18px;
            flex-shrink: 0;
        }

        .server-card:hover .server-arrow { color: var(--accent); }

        .empty {
            color: var(--text-muted);
            font-size: 15px;
            padding: 40px 0;
        }

        .loading {
            color: var(--text-dim);
            font-size: 15px;
            padding: 40px 0;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        /* ◸──────── ✧ ────────🔹-💠-🔹──────── ◇ ———————◹
              SECTION: quiet "host from a link" bookmarklet generator
           ◺──────── ✧ ────────🔹-💠-🔹──────── ◇ ———————◿ */
        .host-from-link {
            margin: 28px auto 4px;
            max-width: 420px;
            text-align: center;
            opacity: .72;
        }

        .hfl-toggle {
            background: none;
            border: 0;
            color: var(--text-dim);
            font: 12px 'Segoe UI', system-ui, sans-serif;
            cursor: pointer;
            opacity: .8;
            padding: 4px;
        }

        .hfl-toggle:hover { opacity: 1; color: var(--text); }

        .hfl-body {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
        }

        .hfl-hint {
            font: 11px 'Segoe UI', system-ui, sans-serif;
            color: var(--text-muted);
            margin: 0 0 2px;
        }

        .hfl-input {
            width: 100%;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg-panel);
            color: var(--text);
            font: 13px 'Segoe UI', system-ui, sans-serif;
        }

        .hfl-input:focus { outline: none; border-color: var(--accent); }

        .hfl-make {
            padding: 8px 14px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg-panel);
            color: var(--text);
            font: 13px 'Segoe UI', system-ui, sans-serif;
            cursor: pointer;
        }

        .hfl-make:hover { border-color: var(--accent); }
        .hfl-make:disabled { opacity: .5; cursor: default; }

        .hfl-drag {
            display: inline-block;
            padding: 9px 16px;
            border-radius: 999px;
            background: var(--accent);
            color: #fff;
            text-decoration: none;
            font: 700 13px 'Segoe UI', system-ui, sans-serif;
            cursor: grab;
        }

        .hfl-error {
            color: var(--accent);
            font: 11px 'Segoe UI', system-ui, sans-serif;
            margin: 0;
        }

    </style>
</head>
<body>
    <div class="picker">
        <img src="/booth/logo.png" alt="" class="picker-logo">
        <h1>DJ BOOTH</h1>
        <p class="subtitle">Select a server</p>
        <div class="server-list" id="server-list">
            <div class="loading">Loading servers...</div>
        </div>

        <div class="host-from-link">
            <button type="button" class="hfl-toggle" id="hfl-toggle" onclick="hflToggle()">host from a link &#9656;</button>
            <div class="hfl-body" id="hfl-body" hidden>
                <p class="hfl-hint">Make a session, then drag the button to your bookmarks bar and click it on your stream tab.</p>
                <input id="hfl-name" class="hfl-input" placeholder="session name (e.g. Friday LP)" maxlength="80">
                <button type="button" class="hfl-make" id="hfl-make" onclick="hflMake()">create + get button</button>
                <p class="hfl-error" id="hfl-error" hidden></p>
                <a id="hfl-bookmarklet" class="hfl-drag" href="#" hidden onclick="return false;">&#9733; Sync this stream</a>
                <a id="hfl-open" href="#" target="_blank" rel="noopener" hidden style="display:inline-block;margin-top:6px;font:12px system-ui;color:var(--accent,#7fd);text-decoration:underline;">&#9654; Open this booth</a>
            </div>
        </div>
    </div>

    <script>
    fetch('/api/guilds')
        .then(function(r) { return r.json(); })
        .then(function(guilds) {
            var list = document.getElementById('server-list');

            if (!guilds.length || guilds.error) {
                list.innerHTML = '<div class="empty">No servers found. Use !starttracking in a Discord channel first.</div>';
                return;
            }

            var html = '';
            guilds.forEach(function(g) {
                var initial = g.name.charAt(0).toUpperCase();
                var iconContent = g.icon
                    ? '<img src="' + g.icon + '">'
                    : initial;
                html +=
                    '<div class="server-card">' +
                    '<div class="server-icon" onclick="event.preventDefault();event.stopPropagation();uploadIcon(\'' + g.guild_id + '\')">' + iconContent + '</div>' +
                    '<a href="/booth?guild=' + g.guild_id + '" style="display:flex;align-items:center;gap:16px;flex:1;text-decoration:none;color:inherit;">' +
                    '<div class="server-info">' +
                    '<div class="server-name">' + g.name + '</div>' +
                    '<div class="server-meta">' + g.song_count + ' songs</div>' +
                    '</div>' +
                    '<span class="server-arrow">&#8594;</span>' +
                    '</a>' +
                    '</div>';
            });
            list.innerHTML = html;
        })
        .catch(function() {
            document.getElementById('server-list').innerHTML =
                '<div class="empty">Could not load servers. Is the database running?</div>';
        });
    /* ◸──────── ✧ ────────🔹-💠-🔹──────── ◇ ———————◹
          SECTION: quiet "host from a link" bookmarklet generator
       ◺──────── ✧ ────────🔹-💠-🔹──────── ◇ ———————◿ */
    function hflToggle() {
        var body = document.getElementById('hfl-body');
        var toggle = document.getElementById('hfl-toggle');
        var opening = body.hidden;
        body.hidden = !opening;
        toggle.innerHTML = opening ? 'host from a link &#9662;' : 'host from a link &#9656;';
    }

    function hflSetError(msg) {
        var err = document.getElementById('hfl-error');
        if (!msg) {
            err.hidden = true;
            err.textContent = '';
            return;
        }
        err.hidden = false;
        err.textContent = msg;
    }

    function hflMake() {
        var nameInput = document.getElementById('hfl-name');
        var makeBtn = document.getElementById('hfl-make');
        var bookmarklet = document.getElementById('hfl-bookmarklet');
        var name = nameInput.value.trim();
        if (!name) {
            hflSetError('Give the session a name first.');
            return;
        }

        hflSetError('');
        bookmarklet.hidden = true;
        document.getElementById('hfl-open').hidden = true;
        makeBtn.disabled = true;
        makeBtn.textContent = 'working...';

        var sessionId = null;

        fetch('/api/solo/sessions', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: name })
        })
        .then(function(r) { return r.json(); })
        .then(function(session) {
            if (!session || !session.id) { throw new Error(session && session.error || 'Could not create session.'); }
            sessionId = session.id;
            return fetch('/api/solo/sessions/' + sessionId + '/watcher', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ enabled: true })
            });
        })
        .then(function(r) { return r.json(); })
        .then(function(watcher) {
            if (!watcher || !watcher.ok) { throw new Error('Could not enable syncing for this session.'); }
            return fetch('/api/solo/watcher-token', { method: 'POST' });
        })
        .then(function(r) { return r.json(); })
        .then(function(tokenResp) {
            if (!tokenResp || !tokenResp.token) { throw new Error(tokenResp && tokenResp.error || 'Could not get a token.'); }

            var origin = location.origin;
            var href = "javascript:(function(d){var s=d.createElement('script');s.src='" +
                origin + "/static/viibr-sync.js#" +
                encodeURIComponent(tokenResp.token) + "|" +
                encodeURIComponent(sessionId) + "|" +
                encodeURIComponent(origin) +
                "';d.body.appendChild(s);})(document);";

            bookmarklet.href = href;
            bookmarklet.textContent = '★ Sync "' + name + '" — drag me to bookmarks';
            bookmarklet.hidden = false;

            var openLink = document.getElementById('hfl-open');
            openLink.href = '/booth?solo=' + encodeURIComponent(sessionId);
            openLink.textContent = '▶ Open this booth (' + name + ')';
            openLink.hidden = false;
        })
        .catch(function(err) {
            hflSetError(err.message || 'Something went wrong.');
        })
        .finally(function() {
            makeBtn.disabled = false;
            makeBtn.textContent = 'create + get button';
        });
    }

    function uploadIcon(guildId) {
        var input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.onchange = function() {
            var file = input.files[0];
            if (!file) return;
            var form = new FormData();
            form.append('icon', file);
            fetch('/api/guilds/' + guildId + '/icon', {
                method: 'POST',
                body: form
            }).then(function(r) {
                if (r.ok) location.reload();
            });
        };
        input.click();
    }
    </script>
</body>
</html>
