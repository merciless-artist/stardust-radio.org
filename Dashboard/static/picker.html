<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <meta name="description" content="Stardust Radio — pick your channel." />
  <meta name="theme-color" content="#000000" />

  <title>Stardust Radio — Pick a Channel</title>

  <link rel="icon" type="image/svg+xml" href="/static/assets/favicon.svg" />
  <link rel="stylesheet" href="/static/css/styles.css" />
  <link rel="stylesheet" href="/static/css/picker.css" />

  <script src="/api/config.js"></script>

  <link rel="preload" as="image" href="/static/assets/stage-silver.png" />
  <link rel="preload" as="image" href="/static/assets/title-silver.png" />
</head>

<body class="picker-page">

  <!-- Stage background -->
  <div class="stage-bg stage-bg--silver" aria-hidden="true"></div>
  <div class="stage-bg stage-bg--gold"   aria-hidden="true"></div>

  <!-- Spotlight -->
  <img class="spotlight" src="/static/assets/spotlight.png" alt="" aria-hidden="true" />

  <!-- ⪧•──────⪧✿⪦── ✦ ──⪧✿──────⪦ ◯ ⋆ ◯ ──────⪧✿──────⪧✿──────⪦ -->
  <!--    SECTION: Title — same wordmark, just like the listener page -->
  <!-- ⪧──•───✿⪦──────⪧•────────⪧✿⪦ ◯ ⋆ ◯ ✿⪦────⪧•───•───✿⪦────•⪦ -->
  <header class="title-bar" role="banner">
    <h1 class="visually-hidden">Stardust Radio — pick a channel</h1>
    <img class="title-img title-img--silver" src="/static/assets/title-silver.png" alt="Stardust Radio" />
  </header>

  <!-- Subtitle / instruction -->
  <p class="picker-subtitle">PICK YOUR CHANNEL</p>

  <!-- Channel grid: cards populated by JS from /api/stations -->
  <main class="picker-grid" id="picker-grid" role="main" aria-live="polite">
    <p class="picker-loading">Tuning in to channels…</p>
  </main>

  <!-- Footer logo -->
  <footer class="brand-footer" role="contentinfo">
    <a class="brand-footer__link" href="#" rel="noopener noreferrer" target="_blank" aria-label="Open the Discord community">
      <img class="brand-footer__logo brand-footer__logo--silver" src="/static/assets/logo-silver.png" alt="Discord" />
    </a>
    <nav class="brand-footer__legal" aria-label="Legal">
      <a href="/privacy" rel="noopener noreferrer" target="_blank">Privacy Policy</a>
      <span class="brand-footer__legal-sep" aria-hidden="true">·</span>
      <a href="/terms" rel="noopener noreferrer" target="_blank">Terms of Service</a>
    </nav>
  </footer>

  <script src="/static/js/picker.js" type="module"></script>
</body>
</html>
